<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网易云解析</title>
<link rel="stylesheet" href="/css/style.css">
</head>

<body>
<main class="wrap">
  <h1>网易云解析</h1>
  <p><a href="https://music.163.com" target="_blank" rel="noopener">官网: 网易云音乐</a></p>

  <section class="box form">
    <select id="mode">
      <option value="single">单曲</option>
      <option value="playlist" selected>歌单</option>
    </select>
    <select id="quality">
      <option value="standard">标准</option>
      <option value="higher">较高</option>
      <option value="exhigh">极高</option>
      <option value="lossless">无损</option>
      <option value="hires" selected>Hi-Res</option>
    </select>
    <input id="target" type="text" autocomplete="off" placeholder="歌曲/歌单链接或 ID">
    <button id="submit">解析</button>
  </section>

  <p id="message" aria-live="polite"></p>
  <p id="apiStatus" class="api-status" aria-live="polite">接口检查中...</p>
  <section class="api-panel" id="apiPanel" hidden>
    <select id="apiProvider" aria-label="接口来源"></select>
    <button id="apiRefresh" type="button">重新检查</button>
  </section>
  <p id="loading" hidden>请求中...</p>

  <section class="box lib" id="libPanel">
    <div class="lib-actions">
      <button id="libPick" type="button" class="ghost">选择音乐文件夹</button>
      <button id="libRescan" type="button" class="ghost" hidden>重新扫描</button>
      <button id="libForget" type="button" class="ghost" hidden>移除授权</button>
    </div>
    <div class="lib-grid">
      <label class="field">
        <span>去重匹配</span>
        <select id="matchMode">
          <option value="exact" selected>严格（歌手 + 歌名）</option>
          <option value="loose">宽松（仅歌名，翻唱易误判）</option>
        </select>
      </label>
      <label class="check"><input id="skipExisting" type="checkbox" checked><span>跳过本地已有的歌曲，不再请求接口</span></label>
    </div>
    <p id="libStatus" class="lib-status" aria-live="polite">未选择本地音乐文件夹。</p>
  </section>

  <section class="box single" id="singleCard" hidden>
    <img id="singleCover" alt="">
    <div>
      <h2 id="singleTitle">-</h2>
      <p id="singleMeta">-</p>
      <p id="singleExtra">-</p>
      <p id="singleMatch" class="lib-status" hidden></p>
      <audio id="singleAudio" controls></audio>
      <button id="singleDownload">下载</button>
    </div>
  </section>

  <section class="box" id="playlistCard" hidden>
    <div class="single">
      <img id="playlistCover" alt="">
      <div>
        <h2 id="playlistTitle">-</h2>
        <p id="playlistMeta">-</p>
        <p id="playlistExtra">-</p>
        <div class="batch">
          <select id="delay">
            <option value="30000">30s</option>
            <option value="60000">1min</option>
            <option value="180000">3min</option>
            <option value="600000" selected>10min</option>
          </select>
          <button id="batchDl">下载选中</button>
          <button id="batchStop" type="button" class="ghost" hidden>停止</button>
          <span id="progress">等待</span>
        </div>
      </div>
    </div>

    <div class="filters">
      <input id="trackFilter" type="search" placeholder="筛选：歌名 / 歌手 / 专辑">
      <label class="check"><input id="hideDownloaded" type="checkbox"><span>隐藏已下载</span></label>
      <button id="pickMissing" type="button" class="ghost">选中待下载</button>
      <button id="clearPick" type="button" class="ghost">清空选择</button>
    </div>
    <p id="trackSummary" class="summary"></p>

    <div id="tracks" class="tracks"></div>
  </section>
</main>

<script src="/js/md5.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/local-library.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
